name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Verify naming
        run: python Tools/verify_ue_naming.py

      - name: Configure
        run: cmake --preset ci

      - name: Build engine, tools, editor and games
        run: cmake --build --preset ci

      - name: Run engine tests
        run: out/build/ci/bin/RendererTests.exe

      - name: Run LeonHorror tests
        run: out/build/ci/bin/LeonHorrorTests.exe

      - name: Validate Sandbox
        run: out/build/ci/bin/AssetTool.exe validate_project --project Samples/Sandbox/Sandbox.lproject
