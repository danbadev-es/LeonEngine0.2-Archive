name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Verify naming
        run: python Tools/verify_ue_naming.py

      - name: Configure
        run: cmake --preset ci

      - name: Build engine, tools, editor and games
        run: cmake --build --preset ci

      # GPU and golden tests draw on WARP, the software Direct3D 12 adapter: no graphics card needed.
      - name: Unit tests
        run: ctest --preset ci -L unit

      - name: GPU tests
        run: ctest --preset ci -L gpu

      - name: Golden tests
        run: ctest --preset ci -L golden

      - name: Validate Sandbox
        run: out/build/ci/bin/AssetTool.exe validate_project --project Samples/Sandbox/Sandbox.lproject
